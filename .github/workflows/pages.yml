name: Deploy to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch, which GitHub
# Pages serves at https://<owner>.github.io/<repo>/.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quote form tests
        run: bun scripts/test-inquiry.ts

      - name: Build
        run: bunx vite build

      - name: Pre-render static pages
        run: node scripts/prerender.mjs

      - name: Publish to gh-pages branch
        working-directory: app/dist/client
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
